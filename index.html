<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal LKH Generator</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <header class="header">
        <img src="assets/logo.png" alt="Logo MTs" class="logo">

        <div class="title">
            <h1>JURNAL LKH GENERATOR</h1>
            <p>MTs. Al Ihsan Tanah Grogot</p>
        </div>
    </header>


    <!-- FORM IDENTITAS -->
    <section class="card">

        <h2>Identitas Guru</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>Nama Guru</label>
                <input type="text" id="namaGuru">
            </div>

            <div class="form-group">
                <label>NIP</label>
                <input type="text" id="nip">
            </div>

            <div class="form-group">
                <label>No. Sertifikasi</label>
                <input type="text" id="sertifikasi">
            </div>

            <div class="form-group">
                <label>Pangkat / Golongan</label>
                <input type="text" id="pangkat">
            </div>

            <div class="form-group">
                <label>Pendidikan</label>
                <input type="text" id="pendidikan">
            </div>

            <div class="form-group">
                <label>Status Guru</label>
                <input type="text" id="status">
            </div>

        </div>

    </section>


    <!-- TEMPLATE -->
    <section class="card">

        <h2>Template Excel</h2>

        <label class="upload-box">

            <input
                type="file"
                id="templateFile"
                accept=".xlsx,.xls"
                hidden>

            <div class="upload-content">

                <div class="upload-icon">
                    📄
                </div>

                <div class="upload-title">
                    Klik untuk memilih Template Excel
                </div>

                <div class="upload-subtitle">
                    atau drag & drop file ke area ini
                </div>

                <div id="fileName" class="filename">
                    Belum ada file dipilih
                </div>

            </div>

        </label>

    </section>


    <!-- BUTTON -->
    <section class="button-area">

        <button id="btnProses" disabled>
            PROSES
        </button>

    </section>

</div>

<script src="js/app.js"></script>

</body>
</html>
